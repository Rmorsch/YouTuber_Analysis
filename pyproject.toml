[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtuber_analysis"
version = "0.1.0"
description = "Creator-analytics pipeline: YouTube Data API v3 + Google Trends -> Snowflake, orchestrated with Dagster and transformed with dbt."
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-dbt",
    "dagster-snowflake",
    "dagster-snowflake-pandas",
    "dbt-snowflake",
    "google-api-python-client",
    "pytrends",
    "pandas",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["youtuber_analysis*"]

[tool.dagster]
module_name = "youtuber_analysis.definitions"
