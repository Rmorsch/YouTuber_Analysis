version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'YOUTUBER_ANALYSIS') }}"
    schema: raw
    tables:
      - name: raw_channels
        description: Daily snapshot of channel-level stats, one row per channel per snapshot_date.
        config:
          loaded_at_field: snapshot_date

      - name: raw_playlist_items
        description: >
          Every video ever seen in a channel's uploads playlist. Not a
          snapshot -- append-only as new videos are discovered.

      - name: raw_videos
        description: Daily snapshot of per-video stats, one row per video per snapshot_date.
        config:
          loaded_at_field: snapshot_date

      - name: raw_google_trends
        description: Interest-over-time snapshot per channel search keyword.
